<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Application (Socket Programming)</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- Pinned official Socket.IO client v4.7.5 -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Chat Application</h1>
      <div class="status-container">
        Connection Status: <span id="status">Disconnected</span>
      </div>
    </header>

    <div id="error-banner" class="error-banner" role="alert" aria-live="polite" hidden></div>

    <section class="controls">
      <label for="username">Username:</label>
      <input type="text" id="username" autocomplete="off" maxlength="100">
      <button id="connect-btn" type="button">Connect</button>
    </section>

    <!-- BL-04: Chat area (message list + composer) -->
    <main id="chat-area" class="chat-area">
      <ol id="message-list" class="message-list" aria-live="polite" aria-label="Chat messages">
        <li id="empty-state" class="empty-state">No messages yet. Say hello!</li>
      </ol>

      <form id="message-form" class="message-form" autocomplete="off" novalidate>
        <label for="message-input" class="visually-hidden">Message</label>
        <textarea id="message-input" class="message-input" rows="1" maxlength="500"
                  placeholder="Type a message..."
                  title="Enter to send, Shift+Enter for a new line"
                  disabled></textarea>
        <button id="send-btn" class="send-btn" type="submit" disabled>Send</button>
      </form>
      <div id="char-counter" class="char-counter" aria-live="off">0 / 500</div>
    </main>
  </div>

  <script src="/static/client.js"></script>
</body>
</html>
